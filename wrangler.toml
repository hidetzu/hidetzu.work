# Cloudflare Workers Static Assets (Worker スクリプトなしの静的配信)
name = "hidetzu-work"
compatibility_date = "2026-09-01"

# apex のみ（www は使わない）。
# デプロイ時にカスタムドメインの割り当てと DNS レコード作成が行われる。
routes = [
  { pattern = "hidetzu.work", custom_domain = true }
]

[assets]
directory = "./dist"
not_found_handling = "404-page"
