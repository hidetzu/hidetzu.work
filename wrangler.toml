# Cloudflare Workers Static Assets (Worker スクリプトなしの静的配信)
name = "hidetzu-work"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"

# 独自ドメインは Cloudflare ダッシュボード側、または以下の routes で設定する。
# hidetzu.work のゾーンを Cloudflare に置いてから有効化する:
# routes = [
#   { pattern = "hidetzu.work", custom_domain = true }
# ]
